# Speaker layout preset for Atmos Visualizer. Add your own: copy a file, edit it, restart the app.
#  name       short name shown in the 3D view (must be unique)
#  label      ITU-R BS.2051 speaker label; bed channels (e.g. the LFE) are routed by it
#  azimuth    degrees, positive = LEFT (ADM convention); elevation degrees, positive = up
#  position   where the speaker sits in the room box, which is what objects are panned with:
#             x -1 left .. +1 right, y -1 rear .. +1 front, z 0 ear level .. 1 ceiling
#  bs2051     optional: the BS.2051 layout this preset is identical to
#  Positions here come from the BS.2127 reference renderer's own tables, except the LFE's:
#  objects are never panned to the LFE, so its position only sets where the sub is drawn
#  (front centre, on the floor).
name: 5.1.4
description: 5.1 plus 4 overhead, top front and top rear (BS.2051 4+5+0)
order: 50
bs2051: 4+5+0   # identical to this BS.2051 layout, so libear uses its standard bed-channel rules
speakers:
  - name: L
    label: M+030
    azimuth: 30
    elevation: 0
    position: [-1, 1, 0]
  - name: R
    label: M-030
    azimuth: -30
    elevation: 0
    position: [1, 1, 0]
  - name: C
    label: M+000
    azimuth: 0
    elevation: 0
    position: [0, 1, 0]
  - name: LFE
    label: LFE1
    azimuth: 45
    elevation: -30
    position: [0, 1, -1]
    lfe: true
  - name: Ls
    label: M+110
    azimuth: 110
    elevation: 0
    position: [-1, -1, 0]
  - name: Rs
    label: M-110
    azimuth: -110
    elevation: 0
    position: [1, -1, 0]
  - name: Ltf
    label: U+030
    azimuth: 30
    elevation: 30
    position: [-1, 1, 1]
  - name: Rtf
    label: U-030
    azimuth: -30
    elevation: 30
    position: [1, 1, 1]
  - name: Ltr
    label: U+110
    azimuth: 110
    elevation: 30
    position: [-1, -1, 1]
  - name: Rtr
    label: U-110
    azimuth: -110
    elevation: 30
    position: [1, -1, 1]
