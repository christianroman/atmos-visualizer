# Speaker layout preset for Atmos Visualizer. Add your own: copy a file, edit it, restart the app.
#  name       short name shown in the 3D view (must be unique)
#  label      ITU-R BS.2051 speaker label; bed channels (e.g. the LFE) are routed by it
#  azimuth    degrees, positive = LEFT (ADM convention); elevation degrees, positive = up
#  position   where the speaker sits in the room box, which is what objects are panned with:
#             x -1 left .. +1 right, y -1 rear .. +1 front, z 0 ear level .. 1 ceiling
#  mount      optional: "wall" draws an upper speaker high on the wall instead of in the ceiling
#  note       optional: why a position isn't the one in BS.2127's tables
#
#  Placement follows Dolby's "11.1.8 mounted overhead speakers" setup guide (dolby.com); speaker
#  names follow Trinnov's loudspeaker position guide (side wall, front to back: Lw, Ls1, Ls, Ls2,
#  Lrs; upper, front to back: Lfh, Ltf, Ltm, Ltr, Lrh).
#  BS.2127 has no 11.1.8 table. Positions without a note are the reference renderer's own; the
#  rest are this file's choice, kept in the same room-box style: wall heights at the top edge of
#  their wall, ceiling pairs and the second rear pair halfway between their neighbours.
#  The LFE's position only sets where the sub is drawn: objects are never panned to it.
name: 11.1.8
description: 9.1 plus a second rear pair, heights on the front and back walls and 4 in the ceiling
order: 100
speakers:
  - name: L
    label: M+030
    azimuth: 30
    elevation: 0
    position: [-1, 1, 0]
  - name: R
    label: M-030
    azimuth: -30
    elevation: 0
    position: [1, 1, 0]
  - name: C
    label: M+000
    azimuth: 0
    elevation: 0
    position: [0, 1, 0]
  - name: LFE
    label: LFE1
    azimuth: 45
    elevation: -30
    position: [0, 1, -1]
    lfe: true
  - name: Lw            # Dolby: 50-70 degrees
    label: M+060
    azimuth: 60
    elevation: 0
    position: [-1, 0.414214, 0]
  - name: Rw
    label: M-060
    azimuth: -60
    elevation: 0
    position: [1, 0.414214, 0]
  - name: Ls            # Dolby "surround": 90-110 degrees
    label: M+090
    azimuth: 90
    elevation: 0
    position: [-1, 0, 0]
  - name: Rs
    label: M-090
    azimuth: -90
    elevation: 0
    position: [1, 0, 0]
  - name: Ls2           # Dolby "surround 1": 117-127 degrees
    label: M+120
    azimuth: 120
    elevation: 0
    position: [-1, -0.5, 0]
    note: not a BS.2051 speaker; halfway between Ls (side) and Lrs (rear corner)
  - name: Rs2
    label: M-120
    azimuth: -120
    elevation: 0
    position: [1, -0.5, 0]
    note: not a BS.2051 speaker; halfway between Rs (side) and Rrs (rear corner)
  - name: Lrs           # Dolby "rear surround": 135-150 degrees
    label: M+135
    azimuth: 135
    elevation: 0
    position: [-1, -1, 0]
  - name: Rrs
    label: M-135
    azimuth: -135
    elevation: 0
    position: [1, -1, 0]
  - name: Lfh           # Dolby "front height": on the front wall, 20-30 degrees up
    label: U+030
    azimuth: 30
    elevation: 25
    position: [-1, 1, 1]
    mount: wall
  - name: Rfh
    label: U-030
    azimuth: -30
    elevation: 25
    position: [1, 1, 1]
    mount: wall
  - name: Ltf           # Dolby "top front": in the ceiling, 45-55 degrees up
    label: U+045
    azimuth: 45
    elevation: 50
    position: [-1, 0.5, 1]
    note: BS.2127 puts U+045 at the front top edge, where Lfh is; moved halfway back towards the seat
  - name: Rtf
    label: U-045
    azimuth: -45
    elevation: 50
    position: [1, 0.5, 1]
    note: BS.2127 puts U-045 at the front top edge, where Rfh is; moved halfway back towards the seat
  - name: Ltr           # Dolby "top rear": in the ceiling, 45-55 degrees up behind
    label: U+135
    azimuth: 135
    elevation: 50
    position: [-1, -0.5, 1]
    note: BS.2127 puts U+135 at the rear top edge, where Lrh is; moved halfway forward towards the seat
  - name: Rtr
    label: U-135
    azimuth: -135
    elevation: 50
    position: [1, -0.5, 1]
    note: BS.2127 puts U-135 at the rear top edge, where Rrh is; moved halfway forward towards the seat
  - name: Lrh           # Dolby "rear height": on the back wall, 20-30 degrees up behind
    label: U+150
    azimuth: 150
    elevation: 25
    position: [-1, -1, 1]
    mount: wall
    note: not a BS.2051 speaker; the rear top edge, as BS.2127 places rear upper speakers
  - name: Rrh
    label: U-150
    azimuth: -150
    elevation: 25
    position: [1, -1, 1]
    mount: wall
    note: not a BS.2051 speaker; the rear top edge, as BS.2127 places rear upper speakers
